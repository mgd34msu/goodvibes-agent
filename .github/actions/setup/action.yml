name: Setup Bun + dependencies
description: Pin Bun and run `bun install`.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.10"
    - name: Install dependencies
      shell: bash
      run: bun install
