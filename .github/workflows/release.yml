name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate or release"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

concurrency:
  group: agent-release-${{ github.event.inputs.ref || github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Typecheck
        run: bun x tsc --noEmit --pretty false
      - name: Tests
        run: bun run test
      - name: Architecture check
        run: bun run architecture:check
      - name: Performance check
        run: bun run perf:check
      - name: Eval gate
        run: bun run eval:gate
      - name: Foundation artifacts
        run: bun run foundation:artifacts
      - name: Build
        run: bun run build
      - name: Compiled binary smoke
        run: bun run scripts/post-build-smoke.ts
      - name: Publish package check
        run: bun run publish:check
      - name: Package install check
        run: bun run package:install-check
      - name: Verification ledger
        run: bun run verification:ledger
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

  pack:
    name: Pack release tarball
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Pack package
        id: pack
        run: |
          mkdir -p dist
          rm -f dist/*.tgz
          PACK_OUTPUT="$(bun pm pack --destination dist 2>&1)"
          printf '%s\n' "$PACK_OUTPUT"
          mapfile -t TARBALLS < <(find dist -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball in dist; found ${#TARBALLS[@]}" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          test -f "dist/${TARBALL}"
      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: dist/${{ steps.pack.outputs.tarball }}
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: dist/
      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Extract changelog excerpt
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          awk -v version="$VERSION" '
            $0 ~ "^## " version " -" { in_section=1; print; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if ! grep -q '[^[:space:]]' /tmp/release_notes.md; then
            printf 'GoodVibes Agent %s\n' "$VERSION" > /tmp/release_notes.md
          fi
          echo "excerpt_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.excerpt_file }}
          draft: false
          prerelease: false
          files: dist/*.tgz

  publish-npm:
    name: Publish to npm
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))) && vars.PUBLISH_NPM == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish package check
        run: bun run publish:check
      - name: Publish to npm
        run: bun run publish:package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm view "@pellux/goodvibes-agent@${VERSION}" version --registry=https://registry.npmjs.org
