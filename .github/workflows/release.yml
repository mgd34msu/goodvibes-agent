name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate or release"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

concurrency:
  group: agent-release-${{ github.event.inputs.ref || github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Verify branch CI passed for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 1800))

          echo "Waiting for CI workflow to pass on ${target_sha}."
          while true; do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${target_sha}" \
              --event push \
              --limit 20 \
              --json databaseId \
              --jq '.[0].databaseId // ""')"

            if [ -n "${run_id}" ]; then
              status="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status --jq '.status')"
              conclusion="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion // ""')"

              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" != "success" ]; then
                  echo "CI workflow ${run_id} completed with conclusion: ${conclusion}" >&2
                  exit 1
                fi

                test_job="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '.jobs[] | select(.name == "test") | .conclusion' | head -n 1)"
                if [ "${test_job}" != "success" ]; then
                  echo "CI workflow ${run_id} did not have a successful test job." >&2
                  exit 1
                fi

                echo "CI workflow ${run_id} passed, including its single test job."
                exit 0
              fi

              echo "CI workflow ${run_id} is ${status}; waiting."
            else
              echo "No CI workflow run found yet for ${target_sha}; waiting."
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Timed out waiting for CI to pass on ${target_sha}." >&2
              echo "Push the release commit to main and wait for branch CI before publishing the tag." >&2
              exit 1
            fi

            sleep 20
          done
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

  pack:
    name: Pack release tarball
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build package runtime
        run: bun run build:package-runtime
      - name: Pack package
        id: pack
        run: |
          mkdir -p dist
          rm -f dist/*.tgz
          PACK_OUTPUT="$(bun pm pack --destination dist 2>&1)"
          printf '%s\n' "$PACK_OUTPUT"
          mapfile -t TARBALLS < <(find dist -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball in dist; found ${#TARBALLS[@]}" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          test -f "dist/${TARBALL}"
      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: dist/${{ steps.pack.outputs.tarball }}
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: goodvibes-agent-linux-x64
          - target: linux-arm64
            artifact: goodvibes-agent-linux-arm64
          - target: darwin-x64
            artifact: goodvibes-agent-macos-x64
          - target: darwin-arm64
            artifact: goodvibes-agent-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build binary (${{ matrix.target }})
        # scripts/build.ts runs prebuild, applies the Bun-compile compatibility
        # patches, compiles the standalone binary for the target, and copies the
        # platform sqlite-vec native addon into dist/lib/ (cross-target addons are
        # warned, not copied — the target-native runner owns its own addon).
        run: bun run scripts/build.ts --target ${{ matrix.target }}
      - name: Report binary size
        run: ls -lh dist/${{ matrix.artifact }}
      - name: Compiled binary smoke (linux-x64 only)
        # linux-arm64 and darwin-x64 cannot be executed on an x64 Linux runner;
        # they are structurally built and checksum-covered here and exercised by
        # the SHA256SUMS manifest. darwin-arm64 is exec-smoked natively on the
        # macos-14 runner (smoke-macos). This is an intentional, documented split.
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          bun run scripts/post-build-smoke.ts --binary "$PWD/dist/${{ matrix.artifact }}"
          # One real command on the runner: status reads config/state from a real
          # filesystem HOME and prints a structured report — a genuine dynamic surface.
          SMOKE_HOME="$(mktemp -d)"
          HOME="$SMOKE_HOME" "$PWD/dist/${{ matrix.artifact }}" status --json > "$SMOKE_HOME/status.json"
          grep -q 'GoodVibes Agent status' "$SMOKE_HOME/status.json"
      - name: Upload binary artifact
        # Uploads the compiled binary plus the target's sqlite-vec native addon
        # tree (dist/lib/sqlite-vec-<os>-<arch>/vec0.<suffix>). scripts/build.ts
        # fetches the target-platform addon from the npm registry on cross-target
        # builds, so every matrix leg contributes its own addon; the release job
        # merges all four and packages them as per-platform release assets.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}-binary
          path: |
            dist/${{ matrix.artifact }}
            dist/lib/
          retention-days: 7

  smoke-macos:
    name: Binary smoke (macos-arm64)
    # macos-14 runners are arm64 and can natively execute the darwin-arm64
    # compiled binary produced by the cross-build above. This exercises the
    # actual shipped bytes (downloaded artifact), not a fresh native rebuild.
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64-binary
          path: dist/
      - name: Mark binary executable
        run: chmod +x dist/goodvibes-agent-macos-arm64
      - name: Compiled binary smoke (macos-arm64)
        run: |
          set -euo pipefail
          bun run scripts/post-build-smoke.ts --binary "$PWD/dist/goodvibes-agent-macos-arm64"
          SMOKE_HOME="$(mktemp -d)"
          HOME="$SMOKE_HOME" "$PWD/dist/goodvibes-agent-macos-arm64" status --json > "$SMOKE_HOME/status.json"
          grep -q 'GoodVibes Agent status' "$SMOKE_HOME/status.json"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))
    needs: [pack, build, smoke-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Download all release artifacts
        # Grabs the npm tarball and all four platform binaries into dist/.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - name: Package sqlite-vec native addons
        # Ships the per-platform sqlite-vec native addon as a release asset so a
        # directly-downloaded binary can restore the semantic vector index by
        # co-locating the addon. Each archive preserves the exact layout the
        # runtime resolver expects — lib/sqlite-vec-<os>-<arch>/vec0.<suffix>
        # relative to the binary's directory — so an installer (or a user)
        # extracts it in place next to the binary with no renaming. A missing
        # addon tree is a hard failure: every platform binary must ship its addon.
        run: |
          set -euo pipefail
          cd dist
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            addon_dir="lib/sqlite-vec-${platform}"
            if [ ! -d "${addon_dir}" ] || [ -z "$(ls -A "${addon_dir}" 2>/dev/null)" ]; then
              echo "Missing sqlite-vec native addon for ${platform} at dist/${addon_dir}" >&2
              exit 1
            fi
            tar -czf "sqlite-vec-${platform}.tar.gz" "${addon_dir}"
            echo "Packaged sqlite-vec-${platform}.tar.gz:"
            tar -tzf "sqlite-vec-${platform}.tar.gz"
          done
      - name: Generate release checksums
        # Pure-binary curl installers verify each binary AND each sqlite-vec
        # addon archive against this manifest; a missing entry is a hard failure
        # for the installer, never a skip.
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            goodvibes-agent-linux-x64 \
            goodvibes-agent-linux-arm64 \
            goodvibes-agent-macos-x64 \
            goodvibes-agent-macos-arm64 \
            sqlite-vec-linux-x64.tar.gz \
            sqlite-vec-linux-arm64.tar.gz \
            sqlite-vec-darwin-x64.tar.gz \
            sqlite-vec-darwin-arm64.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.ref }}"
            TAG="${TAG#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Extract changelog excerpt
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          awk -v version="$VERSION" '
            $0 ~ "^## " version " -" { in_section=1; print; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if ! grep -q '[^[:space:]]' /tmp/release_notes.md; then
            printf 'GoodVibes Agent %s\n' "$VERSION" > /tmp/release_notes.md
          fi
          echo "excerpt_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.excerpt_file }}
          draft: false
          prerelease: false
          files: |
            dist/goodvibes-agent-linux-x64
            dist/goodvibes-agent-linux-arm64
            dist/goodvibes-agent-macos-x64
            dist/goodvibes-agent-macos-arm64
            dist/sqlite-vec-linux-x64.tar.gz
            dist/sqlite-vec-linux-arm64.tar.gz
            dist/sqlite-vec-darwin-x64.tar.gz
            dist/sqlite-vec-darwin-arm64.tar.gz
            dist/SHA256SUMS.txt
            dist/*.tgz

  publish-npm:
    name: Publish to npm
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.ref, 'v') || startsWith(github.event.inputs.ref, 'refs/tags/v')))) && vars.PUBLISH_NPM == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: bun run publish:package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 18); do
            PUBLISHED_VERSION="$(npm view "@pellux/goodvibes-agent@${VERSION}" version --registry=https://registry.npmjs.org 2>/tmp/goodvibes-agent-npm-view.log || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              echo "Verified @pellux/goodvibes-agent@${VERSION} on npm."
              exit 0
            fi
            echo "npm has not exposed @pellux/goodvibes-agent@${VERSION} yet; retrying (${attempt}/18)."
            sleep 10
          done
          cat /tmp/goodvibes-agent-npm-view.log >&2 || true
          echo "Timed out waiting for @pellux/goodvibes-agent@${VERSION} to appear on npm." >&2
          exit 1
      - name: Bun registry install smoke
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TOKEN_SENTINEL="goodvibes-agent-registry-smoke-token-do-not-print-12b4e68d"
          TMP_ROOT="$(mktemp -d)"
          trap 'rm -rf "${TMP_ROOT}"' EXIT
          mkdir -p "${TMP_ROOT}/home/.goodvibes/daemon" "${TMP_ROOT}/cache" "${TMP_ROOT}/bun" "${TMP_ROOT}/workspace"
          printf '{"token":"%s"}\n' "${TOKEN_SENTINEL}" > "${TMP_ROOT}/home/.goodvibes/daemon/operator-tokens.json"
          chmod 600 "${TMP_ROOT}/home/.goodvibes/daemon/operator-tokens.json"

          export HOME="${TMP_ROOT}/home"
          export XDG_CACHE_HOME="${TMP_ROOT}/cache"
          export BUN_INSTALL="${TMP_ROOT}/bun"
          export GOODVIBES_WORKING_DIR="${TMP_ROOT}/workspace"

          bun add -g "@pellux/goodvibes-agent@${VERSION}" --registry https://registry.npmjs.org --minimum-release-age 0
          export PATH="${TMP_ROOT}/bun/bin:${PATH}"

          redact() {
            sed "s/${TOKEN_SENTINEL}/[redacted-connected-host-token]/g" "$1"
          }

          run_installed_agent() {
            local label="$1"
            local stdout_path="$2"
            local stderr_path="$3"
            shift 3

            set +e
            goodvibes-agent "$@" > "${stdout_path}" 2> "${stderr_path}"
            local status="$?"
            set -e

            if grep -Fq "${TOKEN_SENTINEL}" "${stdout_path}" "${stderr_path}"; then
              echo "installed ${label} printed the connected-host token sentinel" >&2
              exit 1
            fi
            if [ "${status}" -ne 0 ]; then
              echo "installed ${label} failed with exit ${status}" >&2
              redact "${stdout_path}" >&2 || true
              redact "${stderr_path}" >&2 || true
              exit "${status}"
            fi
          }

          run_installed_agent "--version" "${TMP_ROOT}/version.txt" "${TMP_ROOT}/version.err" --version
          grep "goodvibes-agent ${VERSION}" "${TMP_ROOT}/version.txt"

          run_installed_agent "--help" "${TMP_ROOT}/help.txt" "${TMP_ROOT}/help.err" --help
          test -s "${TMP_ROOT}/help.txt"

          run_installed_agent "status --json" "${TMP_ROOT}/status.json" "${TMP_ROOT}/status.err" status --json
          grep -q '"title"' "${TMP_ROOT}/status.json"
          grep -q 'GoodVibes Agent status' "${TMP_ROOT}/status.json"
