name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Type check
        run: bun x tsc --noEmit --pretty false
      - name: Run tests
        run: bun run test
      - name: Architecture check
        run: bun run architecture:check
      - name: Performance budget check
        run: bun run perf:check
      - name: Build
        run: bun run build
      - name: Compiled binary smoke
        run: bun run scripts/post-build-smoke.ts
      - name: Publish package check
        run: bun run publish:check
      - name: Package install check
        run: bun run package:install-check
