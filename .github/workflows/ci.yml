name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # cancel-in-progress on PRs only (shared design): a push run on main is never
  # auto-cancelled, which retires the "pin-commit run auto-cancelled, looks red"
  # confusion that release-verify reads by-reference.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      # Each type-check step runs the same package.json script the local
      # `ci:gate` aggregate runs, so CI and the local gate cannot drift apart.
      # The ci-test-policy test enforces that pairing mechanically. Before this,
      # CI ran `tsc` against tsconfig.json only, which excludes src/test and
      # src/**/*.test.ts, and never saw scripts/ or bin/ at all.
      - name: Type check (src)
        run: bun run typecheck
      - name: Type check (tests)
        run: bun run typecheck:test
      - name: Type check (scripts + bin)
        run: bun run typecheck:tools
      - name: Run tests
        run: bun run test
      - name: Coverage gate (ratchet)
        run: bun run coverage:gate
      - name: Architecture check
        run: bun run architecture:check
      - name: Workflow structure check
        run: bun run workflows:check
      - name: Performance budget evaluation (committed fixture)
        run: bun run perf:check
      - name: Build
        run: bun run build
      - name: Compiled binary smoke
        # `bun run build` compiles the unsuffixed native binary; name it
        # explicitly, toolchain.config smoke.binaryDefault points at the
        # linux-x64 release artifact (the binary-matrix fallback), not this one.
        run: bun run scripts/post-build-smoke.ts --binary dist/goodvibes-agent
      - name: Publish package check
        run: bun run publish:check
      - name: Package install check
        run: bun run package:install-check
      - name: Verification ledger
        run: bun run verification:ledger

  # ---------------------------------------------------------------------------
  # Zero-touch release. Runs only after the single `test` gate above is green
  # (its `needs` covers every other ci.yml job, so GitHub schedules it last and
  # only on full success), and only for pushes to main. When the release
  # commit's version has no tag yet, it creates the annotated tag at this SHA
  # and dispatches release.yml at that tag with mode=release.
  #
  # Why the dispatch (not just the tag push): a tag pushed with GITHUB_TOKEN does
  # NOT trigger workflows, so the tag alone would never start release.yml. The
  # documented exception is that a workflow_dispatch API call made with
  # GITHUB_TOKEN DOES create a run, so we push the tag (for provenance + the
  # manual redo path) and then explicitly dispatch the release at that tag ref.
  # Idempotent: an already-existing tag is a logged no-op.
  # ---------------------------------------------------------------------------
  auto-release:
    name: Auto-release (tag + dispatch on green)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - test
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Tag the release and dispatch release.yml (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # A tag existing on the remote only proves a tag was pushed, not that
          # release.yml ever ran for it: if every dispatch attempt in a prior
          # run failed after the tag push already landed, this tag-exists guard
          # used to exit 0 as a false-green no-op, and the tag's existence then
          # made per-job-green refuse a later manual `release.yml` dispatch for
          # the same tag. Check for an actual release.yml run at this tag before
          # treating it as done; re-dispatch if none is found.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin, checking whether release.yml already ran for it."
            # Server-side branch filter: tag-triggered runs carry the bare tag
            # name as head_branch, and the filter matches it regardless of how
            # deep the run sits in history (a client-side page scan would miss
            # runs older than one page).
            RUN_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=${TAG}&per_page=1" --jq '.workflow_runs | length' || echo "unknown")"
            case "${RUN_COUNT}" in ''|*[!0-9]*)
              echo "ERROR: could not determine whether release.yml has run for ${TAG}." >&2
              exit 1 ;;
            esac
            if [ "${RUN_COUNT}" -gt 0 ]; then
              echo "Found ${RUN_COUNT} release.yml run(s) for ${TAG}; nothing to do."
              exit 0
            fi
            echo "Tag ${TAG} exists but no release.yml run was found for it; re-dispatching."
          else
            git config user.name "GoodVibes CI"
            git config user.email "ci@goodvibes.local"
            git tag -a "${TAG}" -m "release ${VERSION}" "${SHA}"
            # Push with GITHUB_TOKEN: this does NOT trigger release.yml (token
            # pushes never trigger workflows), which is why we dispatch below.
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG} at ${SHA}."
          fi
          # Dispatch release.yml at the tag ref. workflow_dispatch via the API
          # under GITHUB_TOKEN DOES create a run (the documented exception).
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run release.yml --ref "refs/tags/${TAG}" -f mode=release; then
              echo "Dispatched release.yml for ${TAG} (mode=release)."
              exit 0
            fi
            echo "gh workflow run failed (attempt ${attempt}/8); retrying in 7s…" >&2
            sleep 7
          done
          echo "ERROR: failed to dispatch release.yml for ${TAG} after 8 attempts." >&2
          exit 1
