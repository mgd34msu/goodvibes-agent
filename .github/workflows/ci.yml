name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  release-commit:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release workflow owns validation
        run: |
          echo "Release commit detected. Full validation, including tests, runs once in the Release workflow for the tag."

  typecheck:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Type check
        run: bun x tsc --noEmit --pretty false

  test:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"
      - name: Run tests
        run: bun run test

  architecture-check:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Architecture check
        run: bun run architecture:check

  perf-check:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Performance budget check
        run: bun run perf:check

  eval-gate:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run eval gate
        run: bun run eval:gate

  package-check:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: bun run build
      - name: Compiled binary smoke
        run: bun run scripts/post-build-smoke.ts
      - name: Publish package check
        run: bun run publish:check
      - name: Package install check
        run: bun run package:install-check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release v')
    needs: [typecheck, test, architecture-check, perf-check, eval-gate, package-check]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: bun run build
